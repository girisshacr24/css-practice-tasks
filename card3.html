<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        .container{
            display: flex;
        }
.card{
           height: 200px;
            width: 300px;
            padding: 20px;
            margin: 10px;
            border: 3px solid black;
            
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="card">This is my First Card</div>
    <div class="card">This is my  Second Card</div>
    <div class="card">This is my Third Card</div>
    <div class="card">This is my Fourth Card</div>
    </div>
    
</body>
</html>
