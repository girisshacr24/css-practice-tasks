<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.card{
            height: 200px;
            width: 300px;
            padding: 20px;
            margin: 10px;
            border: 8px dotted pink;
            
        }
        .card1{
            height: 200px;
            width: 300px;
            padding: 20px;
            margin: 10px;
            border: 10px dashed brown;
            
        }
        .card2{
            height: 200px;
            width: 300px;
            padding: 20px;
            margin: 10px;
            border: 5px solid red;
            
        }
    </style>
</head>
<body>
    <div class="card">This is my First Card</div>
    <div class="card1">This is my second Card</div>
    <div class="card2">This is my Third Card</div>
    
</body>
</html>
