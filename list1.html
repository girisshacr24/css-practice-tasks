<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <style>
        li:nth-child(even){
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <ol>
        <li>Artificial Intelligence</li>
         <li>Machine Learning</li>
          <li>Cloud Computing</li>
           <li>Cyber Security</li>
    </ol>
</body>
</html>
